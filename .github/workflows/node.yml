# Reusable Node check (ERP-02/.github#8): npm ci, then the project's typecheck, lint, test and build scripts.
name: node

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory with package.json and package-lock.json.
        type: string
        default: .
      node-version-file:
        description: Node version file (repository-relative).
        type: string
        default: .nvmrc
      scripts:
        description: npm scripts to run in order.
        type: string
        default: typecheck lint test build

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - working-directory: ${{ inputs.working-directory }}
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          npm ci
          for script in $SCRIPTS; do
            echo "::group::npm run $script"
            npm run "$script"
            echo "::endgroup::"
          done
